name: mawaroute_business
description: MaWaRoute business console (Flutter web) for places and shops.
publish_to: 'none'

version: 1.0.4+3

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^2.0.0
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_analytics: ^13.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_storage: ^14.0.1

  auto_size_text: ^3.0.0
  csv: ^8.0.0
  dotted_border: ^3.1.0
  extended_image: ^10.1.0
  file_picker: ^11.0.3
  flutter_smart_dialog: ^5.3.1
  get: ^4.6.6
  intl: ^0.20.3
  mask_text_input_formatter: ^2.7.0
  qr_flutter: ^4.1.0
  reactive_forms: ^18.2.2
  timeline_tile: ^2.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.3.7
  flutter_test:
    sdk: flutter

# `dart run flutter_native_splash:create` writes the splash into web/.
flutter_native_splash:
  image: assets/images/mawaroute_splash_loading.png
  color: "#eff7fe"
  android: false
  ios: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: MPlusRounded1c
      fonts:
        - asset: assets/fonts/M_PLUS_Rounded_1c/MPLUSRounded1c-Regular.ttf
        - asset: assets/fonts/M_PLUS_Rounded_1c/MPLUSRounded1c-Black.ttf
          weight: 900
        - asset: assets/fonts/M_PLUS_Rounded_1c/MPLUSRounded1c-Bold.ttf
          weight: 700
        - asset: assets/fonts/M_PLUS_Rounded_1c/MPLUSRounded1c-Medium.ttf
          weight: 500
        - asset: assets/fonts/M_PLUS_Rounded_1c/MPLUSRounded1c-Thin.ttf
          weight: 300
